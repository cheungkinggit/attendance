<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6">
<title>藍循教師自助點名系統</title>
<!-- Cloud Sync Edition -->
<style>
:root{--ink:#233044;--muted:#6b7280;--bg:#f5f7fb;--card:#fff;--purple:#5b5bd6;--purple2:#776ae7;--cyan:#19a7ae;--green:#1f9d68;--orange:#f59e42;--red:#dc5a67;--line:#e6e9f0;--shadow:0 14px 40px rgba(42,47,76,.09)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{min-height:100vh} button,input,textarea{font:inherit} button{cursor:pointer}
.app{max-width:600px;margin:0 auto;min-height:100vh;padding:0 10px calc(64px + env(safe-area-inset-bottom))}
.hero{margin:0 -10px 8px;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;background:linear-gradient(135deg,#4f50c9 0%,#7065df 52%,#25aeb8 100%);color:#fff;border-radius:0 0 24px 24px;box-shadow:0 10px 28px rgba(56,56,130,.18)}
.hero-top{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(150px,.95fr);gap:10px;align-items:stretch}
.hero-left{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.school{font-size:10px;opacity:.92;font-weight:850;letter-spacing:.04em}
.hero h1{font-size:19px;line-height:1.15;margin:4px 0 7px;font-weight:950}
.hero-event{background:rgba(255,255,255,.96);color:#2f3550;border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:9px 10px;box-shadow:0 8px 22px rgba(22,27,60,.14);display:flex;flex-direction:column;justify-content:center}
.hero-event-name{font-size:14px;font-weight:950;line-height:1.2;margin-bottom:4px;color:#4e4bc6}
.hero-event-meta{font-size:10px;line-height:1.35;color:#4c566c;font-weight:850}
.hero-event-detail{font-size:9px;line-height:1.35;color:#697286;margin-top:4px;white-space:pre-line}
.statusline{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.attendance-summary{display:flex;align-items:center;gap:7px;margin-top:7px}
.attendance-label{font-size:10px;font-weight:900;opacity:.9}
.attendance-count{font-size:18px;font-weight:950;line-height:1;background:#fff;color:#14825d;border-radius:999px;padding:5px 9px;box-shadow:0 4px 12px rgba(20,130,93,.14)}.all-present-badge{font-size:11px;font-weight:950;background:#ffe36b;color:#6d5600;border-radius:999px;padding:5px 8px;box-shadow:0 4px 10px rgba(109,86,0,.12)} .pill{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12px;font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;background:#d6d9e3} .dot.open{background:#7af0aa;box-shadow:0 0 0 4px rgba(122,240,170,.15)} .dot.closed{background:#ffd3d8}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;margin:8px 0}
.event-title,.meta,.detail{display:none}
.progress-wrap{margin-top:2px} .progress-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:900}
.progress{height:9px;background:#eceef4;border-radius:99px;overflow:hidden;margin-top:7px} .progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));transition:.25s}
.search{position:sticky;top:4px;z-index:5;background:rgba(245,247,251,.9);backdrop-filter:blur(8px);padding:2px 0 4px}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;outline:none;box-shadow:0 6px 18px rgba(42,47,76,.05)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:7px 2px 4px} .section-head h2{font-size:15px;margin:0} .small{font-size:12px;color:var(--muted)}
.name-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.name-btn{width:100%;border:1px solid #e1e5ec;background:#fff;border-radius:11px;padding:6px 7px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;box-shadow:0 6px 18px rgba(42,47,76,.045);transition:.18s}
.name-btn:active{transform:scale(.985)} .name-btn.disabled{opacity:.6;cursor:not-allowed}
.who{display:flex;align-items:center;gap:5px;min-width:0} .avatar{width:30px;height:30px;flex:0 0 30px;border-radius:13px;display:grid;place-items:center;font-weight:950;background:#eef0ff;color:var(--purple);font-size:15px}
.person-main{min-width:0}.name{font-size:15px;font-weight:950;line-height:1.08;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:none}.num-circle{width:19px;height:19px;flex:0 0 19px;border-radius:50%;display:grid;place-items:center;background:#f1f2f6;color:#6f7684;font-size:10px;font-weight:900;border:1px solid #e4e7ee}
.checked .avatar{background:#0f8f63;color:#fff}.checked{border-color:#0c7d56;background:#dff7ec;box-shadow:0 0 0 1px rgba(12,125,86,.08),0 5px 14px rgba(15,143,99,.12)}
.badge{font-size:9px;font-weight:900;padding:4px 5px;border-radius:999px;background:#f0f2f6;color:#8a91a0;white-space:nowrap} .checked .badge{background:#0f8f63;color:#fff}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:14px}
.admin-footer{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:35;margin:0;padding:0}.admin-link{width:38px;height:38px;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(35,48,68,.78);color:#fff;font-size:17px;padding:0;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:.62}.admin-link:hover{opacity:.92;background:#253047}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:#253047;color:white;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.22s;z-index:60} .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.pin-overlay{position:fixed;inset:0;background:rgba(20,27,42,.56);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
.pin-overlay.show{display:flex}
.pin-box{width:min(92vw,380px);background:#fff;border-radius:22px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.24)}
.pin-box h3{margin:0 0 6px;font-size:20px}
.pin-box p{margin:0 0 14px;color:#6b7280;font-size:13px}
.pin-box input{width:100%;border:1px solid #e6e9f0;border-radius:13px;padding:13px 14px;font-size:18px;letter-spacing:.18em;text-align:center;outline:none;background:#fbfcfe}
.pin-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pin-error{min-height:18px;color:#c44252;font-size:12px;font-weight:800;margin-top:8px;text-align:center}

.overlay{position:fixed;inset:0;background:rgba(20,27,42,.56);z-index:90;display:none;align-items:flex-end} .overlay.show{display:flex}
.sheet{width:100%;max-width:680px;max-height:92vh;overflow:auto;margin:auto auto 0;background:#fff;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
.sheetbar{width:45px;height:5px;background:#d7dbe5;border-radius:99px;margin:0 auto 16px} .admin-title{display:flex;align-items:center;justify-content:space-between;gap:10px} .admin-title h2{font-size:20px;margin:0}
.close{border:0;background:#f0f2f6;width:38px;height:38px;border-radius:12px;font-size:20px}
.field{margin:14px 0} .field label{display:block;font-size:12px;color:var(--muted);font-weight:900;margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fbfcfe;outline:none} .field textarea{min-height:150px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.action{border:0;border-radius:14px;padding:13px 10px;font-weight:900} .primary{background:var(--purple);color:#fff} .start{background:var(--green);color:#fff} .stop{background:var(--red);color:#fff} .soft{background:#eef0ff;color:var(--purple)} .warn{background:#fff1e3;color:#a95f15} .dark{background:#263348;color:#fff}
.note{background:#f7f8fd;border:1px solid var(--line);border-radius:13px;padding:11px;font-size:12px;line-height:1.55;color:#596274}.participant-box{background:#f7f8fd;border:1px solid var(--line);border-radius:13px;padding:9px}
.participant-tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.tiny-btn{border:0;border-radius:9px;padding:6px 9px;font-size:11px;font-weight:850;background:#eef0ff;color:var(--purple)}
.participant-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;max-height:260px;overflow:auto}
.participant-item{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #e4e7ee;border-radius:10px;padding:7px 8px;font-size:12px;font-weight:800;cursor:pointer;min-width:0}
.participant-item input{width:16px;height:16px;flex:0 0 16px}
.participant-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.extra-row{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:8px}
.extra-row input{min-width:0}
.extra-list{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
.extra-chip{display:inline-flex;align-items:center;gap:5px;background:#e9f8f1;color:#166d50;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:850}
.extra-chip button{border:0;background:transparent;color:#166d50;font-weight:900;padding:0;line-height:1}
.history-item{padding:9px 0;border-bottom:1px solid #e7eaf0}.history-item:last-child{border-bottom:0}.history-title{font-weight:900;color:#2f394d}.history-meta{font-size:11px;color:#7a8292;margin-top:2px} hr{border:0;border-top:1px solid var(--line);margin:18px 0}
#pdfReport{position:fixed;left:-99999px;top:0;width:794px;height:1123px;background:#fff;color:#223047;padding:38px 42px;font-family:"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.pdf-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:5px solid #5b5bd6;padding-bottom:14px} .pdf-school{font-size:13px;font-weight:800;color:#5b5bd6;letter-spacing:.08em} .pdf-head h1{font-size:27px;margin:5px 0} .pdf-tag{font-size:11px;background:#eaf9f4;color:#177955;border-radius:999px;padding:8px 12px;font-weight:900}
.pdf-event{margin:14px 0;background:#f6f7fb;border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.5}
.pdf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0} .pdf-stat{border:1px solid #e1e5ee;border-radius:12px;padding:8px;text-align:center} .pdf-stat b{display:block;font-size:22px;color:#5b5bd6} .pdf-stat span{font-size:10px;color:#70798a}
.pdf-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;margin-top:8px} .pdf-person{display:grid;grid-template-columns:28px 26px 1fr auto;gap:5px;align-items:center;border-bottom:1px solid #edf0f5;padding:4px 0;font-size:10px}
.pdf-person .ok{color:#168056;font-weight:850} .pdf-person .no{color:#bd4050;font-weight:850}
.pdf-absent-summary{position:absolute;left:42px;right:42px;bottom:54px;background:#fff4f4;border:1px solid #f0c9ce;border-radius:10px;padding:8px 10px;font-size:9px;line-height:1.4;color:#8f3340;max-height:62px;overflow:hidden}.pdf-foot{position:absolute;left:42px;right:42px;bottom:26px;display:flex;justify-content:space-between;border-top:1px solid #e4e8ef;padding-top:9px;font-size:9px;color:#7d8594}


.action:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.25)}
.history-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f7f8fd}
.history-toggle{width:100%;border:0;background:#f1f3f8;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;font-weight:900;color:#364054}
.history-content{display:none;padding:0 10px 8px}
.history-content.open{display:block}
.history-item{padding:9px 0;border-bottom:1px solid #e7eaf0}
.history-item:last-child{border-bottom:0}
.history-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.history-info{min-width:0}
.history-actions{flex:0 0 auto}
.history-download{border:0;background:#263348;color:#fff;border-radius:9px;padding:6px 8px;font-size:10px;font-weight:850}
.save-state{font-size:11px;font-weight:850;margin-top:7px}
.save-state.ok{color:#177955}
.save-state.wait{color:#a95f15}

</style>
</head>
<body>
<div class="app">
<header class="hero">
  <div class="hero-top">
    <div class="hero-left">
      <div>
        <div class="school">藍田循道衞理小學</div>
        <h1>教師自助點名系統</h1>
      </div>
      <div>
      <span id="countTop" style="display:none">0 / 0</span>
      <div class="statusline">
        <div class="pill"><span id="statusDot" class="dot"></span><span id="statusText">尚未開始點名</span></div>
        <div class="pill" id="responsiblePill" style="display:none">負責點名：<span id="responsibleText"></span></div>
      </div>
      <div class="attendance-summary">
        <span class="attendance-label">出席人數</span>
        <span id="heroAttendanceCount" class="attendance-count">0/0</span><span id="allPresentBadge" class="all-present-badge" style="display:none">到齊</span>
      </div>
      </div>
    </div>
    <div class="hero-event">
      <div class="hero-event-name" id="heroEventName">未設定活動</div>
      <div class="hero-event-meta"><span id="heroEventDate">—</span>　<span id="heroEventTime">—</span></div>
      <div class="hero-event-detail" id="heroEventDetail">請等候管理員設定活動資料。</div>
    </div>
  </div>
</header>

<div class="section-head"><h2>教師名單</h2><div class="small" id="hintText"></div></div>
<div id="nameList" class="name-list"></div>
</div>

<div class="admin-footer">
  <button class="admin-link" id="adminLoginBtn" type="button" title="系統設定" aria-label="系統設定">⚙️</button>
</div>
<div class="toast" id="toast"></div>


<div class="pin-overlay" id="pinOverlay">
  <div class="pin-box" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
    <h3 id="pinTitle">管理員登入</h3>
    <p>提示：<span style="font-size:18px" title="電話提示">📞</span></p>
    <input id="loginPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" pattern="[0-9]{8}" placeholder="••••••••">
    <div class="pin-error" id="loginPinError"></div>
    <div class="pin-actions">
      <button class="action soft" id="cancelPin" type="button">取消</button>
      <button class="action primary" id="submitPin" type="button">登入</button>
    </div>
  </div>
</div>

<div class="overlay" id="adminOverlay">
<div class="sheet">
  <div class="sheetbar"></div>
  <div class="admin-title"><h2>管理員控制台</h2><button class="close" id="closeAdmin">×</button></div>
  <div class="note">管理員入口：捲到頁面最底部，按「系統設定」，再於網頁內置登入視窗輸入管理員 PIN。</div>

  <div class="field"><label>活動名稱</label><input id="adminEventName" placeholder="例如：全體教師專業培訓"></div>
  <div class="grid2">
    <div class="field"><label>日期</label><input id="adminDate" type="date"></div>
    <div class="field"><label>時間</label><input id="adminTime" type="time"></div>
  </div>
  <div class="field"><label>活動詳情</label><textarea id="adminDetail" placeholder="輸入地點、注意事項或活動內容"></textarea></div>
  <div class="field"><label>負責點名</label><input id="adminResponsible" placeholder="輸入負責點名的老師姓名（可留空）"></div>

  <div class="field">
    <label>參與老師</label>
    <div class="participant-box">
      <div class="participant-tools">
        <button type="button" class="tiny-btn" id="selectAllParticipants">全選</button>
        <button type="button" class="tiny-btn" id="clearAllParticipants">全部取消</button>
        <span class="small" id="participantCountLabel">已選 0 人</span>
      </div>
      <div class="participant-grid" id="participantGrid"></div>
      <div class="extra-row">
        <input id="extraParticipantInput" placeholder="加入其他老師，例如：72-陳-陳大文">
        <button type="button" class="action soft" id="addExtraParticipant">加入</button>
      </div>
      <div class="extra-list" id="extraParticipantList"></div>
    </div>
  </div>

  <button class="action primary" style="width:100%" id="saveEvent">儲存活動資料</button>
  <div id="eventSaveState" class="save-state wait">請先儲存活動資料，才可開始點名。</div>

  <hr>
  <div class="field">
    <button type="button" class="action soft" style="width:100%" id="teacherListToggle">編輯教師名單</button>
    <div id="teacherListEditor" style="display:none;margin-top:10px">
      <label>教師名單（格式：編號-代號-姓名；每行一位）</label>
      <textarea id="adminNames"></textarea>
      <button class="action soft" style="width:100%;margin-top:8px" id="saveNames">更新教師名單</button>
    </div>
  </div>

  <hr>
  <div class="btnrow">
    <button class="action start" id="startBtn">▶ 開始點名</button>
    <button class="action stop" id="stopBtn">■ 停止點名</button>
  </div>
  <div class="btnrow">
    <button class="action warn" id="resetBtn">↻ 清除目前點名</button>
    <button class="action soft" id="newActivityBtn" type="button">＋ 新活動</button>
  </div>
  <div class="btnrow">
    <button class="action dark" id="pdfBtn" style="grid-column:1 / -1">📄 產生目前 PDF</button>
  </div>

  <div class="note" style="margin-top:12px">
    ⏰ 活動完結後一天，系統將會自動結束活動，並放入「已完成活動紀錄」。
  </div>

  <div class="field">
    <label>已完成活動紀錄</label>
    <div class="history-wrap">
      <button type="button" class="history-toggle" id="historyToggle">
        <span>查看已完成活動</span><span id="historyChevron">▾</span>
      </button>
      <div class="history-content" id="historyContent">
        <div id="historyList">暫時未有已完成活動。</div>
      </div>
    </div>
  </div>
</div>
</div>

<div id="pdfReport">
  <div class="pdf-head">
    <div><div class="pdf-school">藍田循道衞理小學 · LTMPS</div><h1>教師出席報告</h1></div>
  </div>
  <div class="pdf-event" id="pdfEvent"></div>
  <div class="pdf-stats">
    <div class="pdf-stat"><b id="pdfTotal">0</b><span>應點名人數</span></div>
    <div class="pdf-stat"><b id="pdfPresent">0</b><span>已點名</span></div>
    <div class="pdf-stat"><b id="pdfAbsent">0</b><span>未點名</span></div>
  </div>
  <div class="pdf-grid" id="pdfGrid"></div>
  <div class="pdf-absent-summary" id="pdfAbsentSummary"><b>缺席老師：</b><span id="pdfAbsentNames">—</span></div>
  <div class="pdf-foot"><span>藍循教師自助點名系統</span><span id="pdfGenerated"></span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const eventName=document.getElementById("eventName");
const eventDate=document.getElementById("eventDate");
const eventTime=document.getElementById("eventTime");
const eventDetail=document.getElementById("eventDetail");
const countTop=document.getElementById("countTop");
const progressText=document.getElementById("progressText");
const progressBar=document.getElementById("progressBar");
const statusDot=document.getElementById("statusDot");
const statusText=document.getElementById("statusText");
const hintText=document.getElementById("hintText");
const nameList=document.getElementById("nameList");
const pinOverlay=document.getElementById("pinOverlay");
const loginPin=document.getElementById("loginPin");
const loginPinError=document.getElementById("loginPinError");
const cancelPin=document.getElementById("cancelPin");
const submitPin=document.getElementById("submitPin");
const heroEventName=document.getElementById("heroEventName");
const heroEventDate=document.getElementById("heroEventDate");
const heroEventTime=document.getElementById("heroEventTime");
const heroEventDetail=document.getElementById("heroEventDetail");
const responsiblePill=document.getElementById("responsiblePill");
const responsibleText=document.getElementById("responsibleText");
const heroAttendanceCount=document.getElementById("heroAttendanceCount");
const allPresentBadge=document.getElementById("allPresentBadge");
const historyList=document.getElementById("historyList");
const newActivityBtn=document.getElementById("newActivityBtn");
const eventSaveState=document.getElementById("eventSaveState");
const historyToggle=document.getElementById("historyToggle");
const historyContent=document.getElementById("historyContent");
const historyChevron=document.getElementById("historyChevron");

const adminResponsible=document.getElementById("adminResponsible");
const teacherListToggle=document.getElementById("teacherListToggle");
const teacherListEditor=document.getElementById("teacherListEditor");
const participantGrid=document.getElementById("participantGrid");
const participantCountLabel=document.getElementById("participantCountLabel");
const selectAllParticipants=document.getElementById("selectAllParticipants");
const clearAllParticipants=document.getElementById("clearAllParticipants");
const extraParticipantInput=document.getElementById("extraParticipantInput");

function normalizeState_(s){
  if(!s || typeof s!=="object") return null;
  if(!Array.isArray(s.teachers) || !s.teachers.length) s.teachers=DEFAULT_TEACHERS;
  if(!s.event || typeof s.event!=="object") s.event={name:"",date:"",time:"",detail:"",responsible:""};
  if(!s.attendance || typeof s.attendance!=="object") s.attendance={};
  if(!Array.isArray(s.history)) s.history=[];
  if(!s.pin) s.pin="23461033";
  if(!s.event.responsible) s.event.responsible="";
  if(!Array.isArray(s.event.participantKeys)) s.event.participantKeys=s.teachers.map(keyOf);
  if(!Array.isArray(s.event.extraParticipants)) s.event.extraParticipants=[];
  if(typeof s.eventSaved!=="boolean") s.eventSaved=!!s.event.name;
  if(!s.status) s.status="idle";
  if(!("stoppedAt" in s)) s.stoppedAt="";
  return s;
}

function cloudPostState_(){
  if(!cloudReady || cloudApplying) return;
  const payload={action:"setFullState",state:state};
  fetch(CLOUD_API,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload),
    cache:"no-store"
  }).catch(()=>{});
  setTimeout(()=>pullCloudState_(false),200);
}


function cloudPostAttendance_(key,present,timestamp){
  if(!cloudReady) return;
  pendingAttendance.set(key,{present:!!present,timestamp:timestamp||"",until:Date.now()+15000});
  fetch(CLOUD_API,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({
      action:"setAttendance",
      key:key,
      present:!!present,
      timestamp:timestamp||new Date().toISOString()
    }),
    cache:"no-store"
  }).catch(()=>{});
  setTimeout(()=>pullCloudState_(false),180);
  setTimeout(()=>pullCloudState_(false),650);
}

function scheduleCloudPush_(){
  if(!cloudReady || cloudApplying) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(cloudPostState_,180);
}

function persist(skipCloud=false){

function cloudJsonp_(){
  return new Promise((resolve,reject)=>{
    const cb="ltmpsCloud_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error("cloud timeout"));
    },8000);
    function cleanup(){
      clearTimeout(timer);
      try{delete window[cb];}catch(e){window[cb]=undefined;}
      if(s.parentNode)s.parentNode.removeChild(s);
    }
    window[cb]=(data)=>{cleanup();resolve(data);};
    s.onerror=()=>{cleanup();reject(new Error("cloud load failed"));};
    s.src=CLOUD_API+"?action=getState&callback="+encodeURIComponent(cb)+"&_="+Date.now();
    document.head.appendChild(s);
  });
}

async function pullCloudState_(initial=false){
  if(cloudPullBusy) return;
  cloudPullBusy=true;
  try{
    const res=await cloudJsonp_();
    if(!res || !res.ok){cloudPullBusy=false;return;}
    if(!res.state){
      if(initial){
        cloudReady=true;
        cloudPostState_();
      }
      cloudPullBusy=false;
      return;
    }
    const incoming=normalizeState_(res.state);

    const incomingEventKey=[incoming.event?.name||"",incoming.event?.date||"",incoming.event?.time||""].join("|");
    const localEventKey=[state.event?.name||"",state.event?.date||"",state.event?.time||""].join("|");

    // Reset sticky attendance only when moving to a different activity.
    if(stickyEventKey!==incomingEventKey){
      stickyAttendance.clear();
      stickyEventKey=incomingEventKey;
    }

    // Remember every confirmed/locally-seen attendance during the same active activity.
    if(incoming.status==="open"){
      Object.keys(state.attendance||{}).forEach(k=>stickyAttendance.add(k));
      Object.keys(incoming.attendance||{}).forEach(k=>stickyAttendance.add(k));
    }

    // Protect very recent attendance taps from being overwritten by a stale cloud read.
    for(const [k,p] of pendingAttendance.entries()){
      const cloudHas=!!incoming.attendance[k];
      if(cloudHas===p.present){
        pendingAttendance.delete(k);
      }else if(Date.now()<p.until){
        if(p.present) incoming.attendance[k]=p.timestamp||state.attendance[k]||new Date().toISOString();
        else delete incoming.attendance[k];
      }else{
        pendingAttendance.delete(k);
      }
    }

    // During an active activity, never let an older cloud snapshot turn
    // a teacher from "出席" back to "未點名".
    if(incoming.status==="open" && incomingEventKey===localEventKey){
      stickyAttendance.forEach(k=>{
        const pending=pendingAttendance.get(k);
        if(pending && pending.present===false) return;
        if(!incoming.attendance[k] && state.attendance[k]){
          incoming.attendance[k]=state.attendance[k];
        }
      });
    }

    const snap=JSON.stringify(incoming);
    if(snap!==lastCloudSnapshot && snap!==JSON.stringify(state)){
      cloudApplying=true;
      state=incoming;
      localStorage.setItem(K,JSON.stringify(state));
      lastCloudSnapshot=snap;
      autoCloseExpiredEvent();
      render();
      if(adminOverlay && adminOverlay.classList.contains("show")) loadAdmin();
      cloudApplying=false;
    }else{
      lastCloudSnapshot=snap;
    }
    cloudReady=true;
  }catch(err){
    // Keep local operation available if the network is temporarily unavailable.
  }finally{
    cloudPullBusy=false;
  }
}

function scheduleNextCloudPull_(){

  const base=state && state.status==="open" ? 550 : 5000;
  const delay=base + (state && state.status==="open" ? Math.floor(Math.random()*150) : 0);

    await pullCloudState_(false);
    scheduleNextCloudPull_();
  },delay);
}
async function initCloudSync_(){
  await pullCloudState_(true);
  cloudReady=true;
  scheduleNextCloudPull_();

      pullCloudState_(false);
      scheduleNextCloudPull_();
    }
  });
  window.addEventListener("focus",()=>{
    pullCloudState_(false);
    scheduleNextCloudPull_();
  });
}

function localDateString(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function isEventPastByOneDay(){
  if(!state.event || !state.event.date) return false;
  return state.event.date < localDateString();
}
function removeMatchingArchived(stoppedAt,eventObj){
  state.history=state.history.filter(h=>!(h.stoppedAt===stoppedAt && h.event && h.event.name===eventObj.name && h.event.date===eventObj.date));
}
function autoCloseExpiredEvent(){
  if(!isEventPastByOneDay()) return false;
  if(state.event && state.event.name){
    if(state.status==="open" || state.status==="idle"){
      state.status="closed";
      state.stoppedAt=state.stoppedAt||new Date().toISOString();
      archiveCurrent();
    } else if(state.status==="closed"){
      archiveCurrent();
    }
    persist();
    return true;
  }
  return false;
}
function prepareFreshActivityAfterExpiry(){
  if(!isEventPastByOneDay()) return false;
  autoCloseExpiredEvent();
  state.event={name:"",date:"",time:"",detail:"",responsible:"",participantKeys:state.teachers.map(keyOf),extraParticipants:[]};
  state.attendance={};
  state.status="idle";
  state.stoppedAt="";
  state.eventSaved=false;
  persist();
  return true;
}
function setStartAvailability(){
  if(!startBtn || !eventSaveState) return;
  const ready=!!state.eventSaved && !!state.event.name && currentParticipants().length>0 && state.status==="idle";
  startBtn.disabled=!ready;
  if(state.status==="open"){
    startBtn.disabled=true;
    eventSaveState.textContent="點名已開始。";
    eventSaveState.className="save-state ok";
  }else if(state.status==="closed"){
    startBtn.disabled=true;
    eventSaveState.textContent="本次活動已停止，如需繼續請按「恢復點名」。";
    eventSaveState.className="save-state ok";
  }else if(state.eventSaved){
    eventSaveState.textContent="活動資料已儲存，可以開始點名。";
    eventSaveState.className="save-state ok";
  }else{
    eventSaveState.textContent="請先儲存活動資料，才可開始點名。";
    eventSaveState.className="save-state wait";
  }
}
function markEventDirty(){

}

function parseTeacherLine(line){
  const p=String(line||"").split("-").map(x=>x.trim());
  if(p.length<3) return null;
  const no=p.shift()||"—";
  const code=p.shift()||"—";
  const name=p.join("-").trim();
  if(!name) return null;
  return {no,code,name};
}
function currentParticipants(){
  const selected=new Set(state.event.participantKeys||[]);
  const normal=state.teachers.filter(t=>selected.has(keyOf(t)));
  const extras=Array.isArray(state.event.extraParticipants)?state.event.extraParticipants:[];
  return [...normal,...extras];
}

function snapshotCurrent(){
 return {
   id: Date.now(),
   event: JSON.parse(JSON.stringify(state.event)),
   attendance: JSON.parse(JSON.stringify(state.attendance)),
   status: state.status,
   stoppedAt: state.stoppedAt || new Date().toISOString(),
   teachers: JSON.parse(JSON.stringify(currentParticipants()))
 };
}
function archiveCurrent(){
 if(!state.event.name) return;
 const already=state.history.some(h=>h.event && h.event.name===state.event.name && h.event.date===state.event.date && h.stoppedAt===state.stoppedAt);
 if(!already) state.history.unshift(snapshotCurrent());
}

function beginNewActivity(){

   toast("請先停止目前點名");

 state.attendance={};
 state.status="idle";
 state.stoppedAt="";

   const k=keyOf(t),ok=!!state.attendance[k];

    <span class="who"><span class="num-circle">${esc(t.no)}</span><span class="avatar">${esc(avatarText(t))}</span>

   if(state.attendance[k]){
     if(confirm(`「${t.name}」已完成點名。要取消嗎？`)){

       stickyAttendance.delete(k);

     persist(true);
     render();
     cloudPostAttendance_(k,true,ts);

   }
 });

}
function openPinLogin(){
 loginPin.value="";loginPinError.textContent="";
 pinOverlay.classList.add("show");
 setTimeout(()=>loginPin.focus(),50);
}
function closePinLogin(){
 pinOverlay.classList.remove("show");
 loginPinError.textContent="";
}
function submitPinLogin(){
 const p=loginPin.value.trim();
 if(!/^\d{8}$/.test(p)){
   loginPinError.textContent="請輸入 8 位數字。";
   loginPin.select();
   return;
 }
 if(p!==state.pin){
   loginPinError.textContent="PIN 不正確，請再試。";
   loginPin.select();
   return;
 }
 closePinLogin();
 loadAdmin();
 adminOverlay.classList.add("show");
}

closeAdmin.onclick=()=>adminOverlay.classList.remove("show");
adminOverlay.onclick=e=>{if(e.target===adminOverlay)adminOverlay.classList.remove("show");};

saveEvent.onclick=()=>{
 if(currentParticipants().length===0){toast("請至少選擇一位參與老師");return;}
 const next={
   name:adminEventName.value.trim(),
   date:adminDate.value,
   time:adminTime.value,
   detail:adminDetail.value.trim(),
   responsible:adminResponsible.value.trim(),
   participantKeys:[...(state.event.participantKeys||[])],
   extraParticipants:JSON.parse(JSON.stringify(state.event.extraParticipants||[]))
 };
 const changed=JSON.stringify(next)!==JSON.stringify(state.event);
 if(state.status==="closed" && changed){
   archiveCurrent();
   state.attendance={};
   state.status="idle";
   state.stoppedAt="";
 }
 state.event=next;
 state.eventSaved=true;
 persist();render();toast(state.status==="idle"&&changed?"新活動資料已儲存":"活動資料已儲存");
};
saveNames.onclick=()=>{
 const lines=adminNames.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);const list=[];
 for(const line of lines){const t=parseTeacherLine(line);if(t)list.push(t);}
 if(!list.length){toast("名單格式不正確");return;}
 const oldAllSelected=(state.event.participantKeys||[]).length===state.teachers.length;
 state.teachers=list;
 const valid=new Set(list.map(keyOf));
 Object.keys(state.attendance).forEach(k=>{if(!valid.has(k) && !(state.event.extraParticipants||[]).some(t=>keyOf(t)===k))delete state.attendance[k];});
 if(oldAllSelected && state.status==="idle") state.event.participantKeys=list.map(keyOf);
 else state.event.participantKeys=(state.event.participantKeys||[]).filter(k=>valid.has(k));
 persist();renderParticipantSelector();render();toast("教師名單已更新");
};
startBtn.onclick=()=>{if(state.status==="closed"){toast("如需繼續，請按「恢復點名」");return;}if(!state.eventSaved){toast("請先儲存活動資料");return;}if(!state.event.name){toast("請先輸入活動名稱");return;}if(currentParticipants().length===0){toast("請先選擇參與老師");return;}state.status="open";state.stoppedAt="";persist();render();adminOverlay.classList.remove("show");toast("▶ 已開始點名");};
stopBtn.onclick=()=>{
 if(state.status==="closed"){
   if(!confirm("確認恢復本次點名？老師將可以再次點名。"))return;
   const stopped=state.stoppedAt;
   state.history=state.history.filter(h=>!(h.stoppedAt===stopped && h.event && h.event.name===state.event.name && h.event.date===state.event.date));
   state.status="open";
   state.stoppedAt="";
   persist();render();
   toast("▶ 已恢復點名");
   return;
 }
 if(state.status!=="open"){
   toast("點名尚未開始");
   return;
 }
 if(!confirm("確認停止本次點名？停止後仍可由管理員恢復。"))return;
 state.status="closed";
 state.stoppedAt=new Date().toISOString();
 archiveCurrent();
 persist();render();
 toast("■ 點名已停止，活動紀錄已自動儲存");
};
resetBtn.onclick=()=>{if(!confirm("確認清除目前活動嘅點名紀錄？已封存嘅舊活動紀錄唔會受影響。"))return;state.attendance={};state.status="idle";state.stoppedAt="";persist();render();toast("已清除本次點名");};

selectAllParticipants.onclick=()=>{
  state.event.participantKeys=state.teachers.map(keyOf);
  renderParticipantSelector();
};
clearAllParticipants.onclick=()=>{
  state.event.participantKeys=[];
  renderParticipantSelector();
};
addExtraParticipant.onclick=()=>{
  const t=parseTeacherLine(extraParticipantInput.value);
  if(!t){toast("請用格式：編號-代號-姓名");return;}
  const k=keyOf(t);
  if(currentParticipants().some(x=>keyOf(x)===k)){toast("呢位老師已在名單內");return;}
  state.event.extraParticipants=state.event.extraParticipants||[];
  state.event.extraParticipants.push(t);
  extraParticipantInput.value="";
  renderExtraParticipants();updateParticipantCount();
};
extraParticipantInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addExtraParticipant.click();}});


[adminEventName,adminDate,adminTime,adminDetail,adminResponsible].forEach(el=>{
  el.addEventListener("input",markEventDirty);
  el.addEventListener("change",markEventDirty);
});
participantGrid.addEventListener("change",markEventDirty);
selectAllParticipants.addEventListener("click",()=>setTimeout(markEventDirty,0));
clearAllParticipants.addEventListener("click",()=>setTimeout(markEventDirty,0));
addExtraParticipant.addEventListener("click",()=>setTimeout(markEventDirty,0));

historyToggle.addEventListener("click",()=>{
  const open=historyContent.classList.toggle("open");
  historyChevron.textContent=open?"▴":"▾";
});


teacherListToggle.addEventListener("click",()=>{
  const isOpen=teacherListEditor.style.display!=="none";
  teacherListEditor.style.display=isOpen?"none":"block";
  teacherListToggle.textContent=isOpen?"編輯教師名單":"收起教師名單";
});

newActivityBtn.onclick=beginNewActivity;

function fillPdfFromData(data){
 const participants=data.teachers||[];
 const attendance=data.attendance||{};
 const event=data.event||{};
 const present=participants.filter(t=>attendance[keyOf(t)]);
 const absent=participants.filter(t=>!attendance[keyOf(t)]);
 pdfTotal.textContent=participants.length;
 pdfPresent.textContent=present.length;
 pdfAbsent.textContent=absent.length;
 pdfAbsentNames.textContent=absent.length?absent.map(t=>t.name).join("、"):"沒有";
 pdfEvent.innerHTML=`<b>${esc(event.name||"未命名活動")}</b><br>日期：${esc(fmtDate(event.date))}　｜　時間：${esc(event.time||"—")}${event.responsible?`　｜　負責點名：${esc(event.responsible)}`:""}<br>${esc(event.detail||"")}`;
 pdfGrid.innerHTML=participants.map(t=>{
   const k=keyOf(t),ok=!!attendance[k],tm=ok?new Date(attendance[k]).toLocaleTimeString("zh-HK",{hour:"2-digit",minute:"2-digit"}):"";
   return `<div class="pdf-person"><span>${esc(t.no)}</span><span>${esc(t.code)}</span><span>${esc(t.name)}</span><span class="${ok?"ok":"no"}">${ok?"✓ "+tm:"— 未點名"}</span></div>`;
 }).join("");
 pdfGenerated.textContent="產生時間："+new Date().toLocaleString("zh-HK",{hour12:false});
}
function buildPdf(){
 fillPdfFromData({teachers:currentParticipants(),attendance:state.attendance,event:state.event});
}
async function exportPdfData(data){
 if(typeof html2canvas==="undefined"||!window.jspdf){alert("PDF 元件未能載入，請確認裝置已連接互聯網後再試。");return;}
 fillPdfFromData(data);
 toast("正在產生 PDF…");
 const node=document.getElementById("pdfReport");
 const canvas=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:"#ffffff"});
 const img=canvas.toDataURL("image/jpeg",.94);
 const {jsPDF}=window.jspdf;
 const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
 pdf.addImage(img,"JPEG",0,0,210,297);
 const ev=data.event||{};
 const safe=(ev.name||"教師出席報告").replace(/[\\/:*?"<>|]/g,"-");
 pdf.save(`${safe}_${ev.date||"日期"}.pdf`);
 toast("PDF 已產生");
}
async function generateHistoricalPdf(index){
 const h=state.history[index];
 if(!h){toast("找不到活動紀錄");return;}
 await exportPdfData({teachers:h.teachers||[],attendance:h.attendance||{},event:h.event||{}});
}
pdfBtn.onclick=async()=>{
 if(state.status!=="closed"&&!confirm("點名尚未停止。仍要產生目前狀態嘅報告嗎？"))return;
 await exportPdfData({teachers:currentParticipants(),attendance:state.attendance,event:state.event});
};
const adminLoginBtn=document.getElementById("adminLoginBtn");
adminLoginBtn.addEventListener("click",function(e){
  e.preventDefault();
  openPinLogin();
});
cancelPin.addEventListener("click",closePinLogin);
submitPin.addEventListener("click",submitPinLogin);
loginPin.addEventListener("keydown",function(e){
  if(e.key==="Enter") submitPinLogin();
  if(e.key==="Escape") closePinLogin();
});
pinOverlay.addEventListener("click",function(e){
  if(e.target===pinOverlay) closePinLogin();
});
autoCloseExpiredEvent();
render();
initCloudSync_();
</script>
